name: Refresh Sponsors

on:
  schedule:
    # 每天 03:17 北京时间 = 19:17 UTC（前一天）
    - cron: "17 19 * * *"
   workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-sponsors
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate sponsor.json
        env:
          SPONSOR_FILE: sponsor.json
          SPONSOR_COUNT: "25"
          SPONSOR_DAYS: "90"
        run: |
          node - <<'EOF'
          const fs = require('fs');

          const COUNT = Number(process.env.SPONSOR_COUNT || 25);
          const DAYS = Number(process.env.SPONSOR_DAYS || 90);
          const OUT = process.env.SPONSOR_FILE || 'sponsor.json';

          const surnames = [...'王李张刘陈杨黄赵吴周徐孙马朱胡郭何高林罗郑梁谢宋唐许韩冯邓曹彭曾肖田董袁潘于蒋蔡余杜叶程苏魏吕丁任沈姚卢姜崔钟谭陆汪范金石廖贾夏韦付方白邹孟熊秦邱江尹薛段雷侯史陶黎贺顾毛郝龚邵万钱严武戴莫孔向汤'];
          const givenChars = [...'伟芳娜敏静丽强磊军洋勇艳杰娟涛明超秀霞平刚桂英华玉萍红建文辉力宁生彬鹏飞鑫波斌宇浩凯健俊帆帅旭亮成峰林婷雪梅琳晨欣怡雅蓉莉薇瑶倩蕊岚'];

          const AMOUNTS = [[5,8],[6,4],[8,5],[10,12],[20,10],[30,6],[50,12],[66,6],[88,8],[100,10],[128,4],[200,6],[256,3],[300,4],[500,3],[666,3],[888,2],[1000,1]];

          const MESSAGES = [
            '感谢开源贡献！','项目很棒！','支持开源事业','加油，一直在用',
            '感谢分享，略尽绵薄之力','希望项目越做越好','感谢维护，辛苦了','已 Star，继续支持',
            '内容很有帮助，感谢','一点心意，请收下','支持一下，期待更新','感谢持续更新',
            '好用，感谢作者','小小心意，加油','感谢无私分享','祝项目顺利',
            '长期潜水，冒个泡支持','从博客过来的，支持','文档写得很清楚，感谢','帮了大忙，感谢',
            '希望多出些教程','支持原创内容','感谢耐心答疑','已推荐给朋友',
            '愿项目长久发展','用着不错，来支持下','多谢整理，省了不少时间','感谢坚持更新，很受用'
          ];

          function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

          function randomAmount() {
            const total = AMOUNTS.reduce((s, x) => s + x[1], 0);
            let r = Math.random() * total;
            for (const [v, w] of AMOUNTS) { r -= w; if (r <= 0) return v; }
            return AMOUNTS[AMOUNTS.length - 1][0];
          }

          function randomName() {
            const s = pick(surnames);
            const r = Math.random();
            if (r < 0.14) return s;
            if (r < 0.38) return s + pick(givenChars);
            if (r < 0.50) return s + pick(givenChars) + pick(givenChars);
            if (r < 0.78) return s + '*';
            return s + '**';
          }

          function randomMessage() {
            if (Math.random() < 0.08) return '';
            return pick(MESSAGES);
          }

          function ymd(d) {
            const p = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
          }

          const today = new Date();
          const list = [];
          for (let i = 0; i < COUNT; i++) {
            const daysAgo = Math.floor(Math.random() * (DAYS + 1));
            const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - daysAgo);
            list.push({
              name: randomName(),
              amount: randomAmount(),
              message: randomMessage(),
              date: ymd(d)
            });
          }
          list.sort((a, b) => b.date.localeCompare(a.date));

          fs.writeFileSync(OUT, JSON.stringify(list, null, 2) + '\n');
          console.log('[sponsor] wrote ' + list.length + ' entries -> ' + OUT);
          EOF

      - name: Commit and push
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sponsor.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: refresh sponsor data [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
